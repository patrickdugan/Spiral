name: Keyless CHECKSIG research checks

on:
  push:
    paths:
      - 'BIPSpace/Keyless-CHECKSIG/**'
      - '.github/workflows/keyless-checksig-research.yml'
  pull_request:
    paths:
      - 'BIPSpace/Keyless-CHECKSIG/**'
      - '.github/workflows/keyless-checksig-research.yml'

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run BIP341 vectors and experimental Script tests
        run: python -m unittest discover -s BIPSpace/Keyless-CHECKSIG -p 'test_reference.py' -v
      - name: Print reference demonstration
        run: python BIPSpace/Keyless-CHECKSIG/reference.py
