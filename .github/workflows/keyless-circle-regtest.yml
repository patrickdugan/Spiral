name: Keyless Circle STARK regtest block

on:
  push:
    paths:
      - '.github/workflows/keyless-circle-regtest.yml'
      - 'BIPSpace/Keyless-CHECKSIG/verifiers/regtest_circle_block.py'
      - 'BIPSpace/Keyless-CHECKSIG/verifiers/patch_core_regtest.py'
  pull_request:
    paths:
      - '.github/workflows/keyless-circle-regtest.yml'
      - 'BIPSpace/Keyless-CHECKSIG/verifiers/regtest_circle_block.py'
      - 'BIPSpace/Keyless-CHECKSIG/verifiers/patch_core_regtest.py'

permissions:
  contents: read

jobs:
  regtest-block:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_HUSKY_DONT_INSTALL_HOOKS: 'true'
      KEYLESS_EXPORT_DIR: ${{ github.workspace }}/circle-stages
    steps:
      - uses: actions/checkout@v4
      - name: Generate and check real proof from pinned Circle-STARK source
        shell: bash
        run: |
          set -euo pipefail
          git init /tmp/keyless-regtest-circle
          git -C /tmp/keyless-regtest-circle remote add origin https://github.com/Bitcoin-Wildlife-Sanctuary/bitcoin-circle-stark.git
          git -C /tmp/keyless-regtest-circle fetch --depth=1 origin 9540164f243b23e4ca995c153f70ec64744df28a
          git -C /tmp/keyless-regtest-circle checkout --detach FETCH_HEAD
          test "$(git -C /tmp/keyless-regtest-circle rev-parse HEAD)" = 9540164f243b23e4ca995c153f70ec64744df28a
          rustup toolchain install nightly-2024-11-06 --profile minimal
          cd /tmp/keyless-regtest-circle
          python3 "$GITHUB_WORKSPACE/BIPSpace/Keyless-CHECKSIG/verifiers/export_circle_stages.py" /tmp/keyless-regtest-circle
          cargo test --locked --features assume-op-cat dsl::plonk::test::test_generate_dsl -- --exact --nocapture 2>&1 | tee "$GITHUB_WORKSPACE/regtest-proof.log"
      - name: Patch pinned Core for explicit regtest-only experimental activation
        shell: bash
        run: |
          set -euo pipefail
          git init /tmp/keyless-regtest-core
          git -C /tmp/keyless-regtest-core remote add origin https://github.com/bitcoin/bitcoin.git
          git -C /tmp/keyless-regtest-core fetch --depth=1 origin d0f6d9953a15d7c7111d46dcb76ab2bb18e5dee3
          git -C /tmp/keyless-regtest-core checkout --detach FETCH_HEAD
          test "$(git -C /tmp/keyless-regtest-core rev-parse HEAD)" = d0f6d9953a15d7c7111d46dcb76ab2bb18e5dee3
          python3 BIPSpace/Keyless-CHECKSIG/core/patch_core.py /tmp/keyless-regtest-core
          python3 BIPSpace/Keyless-CHECKSIG/verifiers/patch_core_regtest.py /tmp/keyless-regtest-core
          git -C /tmp/keyless-regtest-core diff > regtest-core.patch
      - name: Build actual Bitcoin Core daemon
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libboost-dev libevent-dev ninja-build
          cmake -S /tmp/keyless-regtest-core -B /tmp/keyless-regtest-core/build -G Ninja -DENABLE_WALLET=OFF -DENABLE_IPC=OFF -DBUILD_GUI=OFF -DBUILD_TESTS=OFF -DBUILD_BENCH=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS_RELEASE='-O1 -g0'
          cmake --build /tmp/keyless-regtest-core/build --target bitcoind -j 2
      - name: Reject mutated block and accept funding plus all 72 transitions
        shell: bash
        run: |
          set -euo pipefail
          python3 BIPSpace/Keyless-CHECKSIG/verifiers/regtest_circle_block.py /tmp/keyless-regtest-core/build/bin/bitcoind circle-stages regtest-results | tee regtest-results.log
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path('regtest-results/regtest-circle-results.json')
          result=json.loads(p.read_text())
          assert result['proof_stage_count']==72 and result['block']['transactions']==74
          assert result['block']['weight']<4_000_000 and result['connected_peers']==0
          assert result['valid_block_submit_result'] is None
          assert result['terminal_value_sats']==9_280_000
          result['run_id']=int(os.environ['GITHUB_RUN_ID'])
          result['spiral_commit']=os.environ['GITHUB_SHA']
          result['artifact_hashes']={name:hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() for name in ('regtest-core.patch','regtest-proof.log','regtest-results/circle-chain-valid-block.hex','regtest-results/circle-chain-invalid-block.hex')}
          p.write_text(json.dumps(result,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keyless-circle-regtest-block
          path: |
            regtest-results
            regtest-results.log
            regtest-core.patch
            regtest-proof.log
