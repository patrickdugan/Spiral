name: Keyless Circle STARK regtest blocks

on:
  push:
    paths:
      - '.github/workflows/keyless-circle-regtest.yml'
      - 'BIPSpace/Keyless-CHECKSIG/core/patch_regtest_validation.py'
      - 'BIPSpace/Keyless-CHECKSIG/core/regtest_circle_blocks.py'
      - 'BIPSpace/Keyless-CHECKSIG/core/patch_core.py'
  pull_request:
    paths:
      - '.github/workflows/keyless-circle-regtest.yml'
      - 'BIPSpace/Keyless-CHECKSIG/core/patch_regtest_validation.py'
      - 'BIPSpace/Keyless-CHECKSIG/core/regtest_circle_blocks.py'
      - 'BIPSpace/Keyless-CHECKSIG/core/patch_core.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  regtest-blocks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CCACHE_DIR: /home/runner/.cache/keyless-core-ccache
      CCACHE_MAXSIZE: 400M
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact previously verified real STWO proof artifact
        uses: actions/download-artifact@v4
        with:
          name: keyless-linked-circle-chain
          run-id: 43168685081
          repository: patrickdugan/Spiral
          github-token: ${{ github.token }}
          path: proof-evidence
      - name: Authenticate proof fixtures and check Python syntax
        run: |
          set -euo pipefail
          echo '3d56ce8d29a2576142148f3733b29e398ad6794d74f07183d9e055ce309fbfd0  proof-evidence/circle-chain-vectors.json' | sha256sum --check
          python3 -m py_compile BIPSpace/Keyless-CHECKSIG/core/patch_regtest_validation.py BIPSpace/Keyless-CHECKSIG/core/regtest_circle_blocks.py
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/keyless-core-ccache
          key: keyless-regtest-core30-${{ runner.os }}-${{ hashFiles('BIPSpace/Keyless-CHECKSIG/core/patch*.py') }}
          restore-keys: |
            keyless-regtest-core30-${{ runner.os }}-
      - name: Prepare pinned Core with compile-time regtest-only research rules
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libboost-dev libevent-dev ninja-build ccache
          git init /tmp/keyless-block-core
          git -C /tmp/keyless-block-core remote add origin https://github.com/bitcoin/bitcoin.git
          git -C /tmp/keyless-block-core fetch --depth=1 origin d0f6d9953a15d7c7111d46dcb76ab2bb18e5dee3
          git -C /tmp/keyless-block-core checkout --detach FETCH_HEAD
          test "$(git -C /tmp/keyless-block-core rev-parse HEAD)" = d0f6d9953a15d7c7111d46dcb76ab2bb18e5dee3
          python3 BIPSpace/Keyless-CHECKSIG/core/patch_core.py /tmp/keyless-block-core
          python3 BIPSpace/Keyless-CHECKSIG/core/patch_regtest_validation.py /tmp/keyless-block-core
          git -C /tmp/keyless-block-core diff > keyless-regtest-core.patch
          cmake -S /tmp/keyless-block-core -B /tmp/keyless-block-core/build -G Ninja \
            -DENABLE_WALLET=OFF -DENABLE_IPC=OFF -DBUILD_GUI=OFF -DBUILD_TESTS=OFF -DBUILD_BENCH=OFF \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS_RELEASE='-O1 -g0 -DKEYLESS_RESEARCH_REGTEST=1' \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache
      - name: Build research bitcoind
        shell: bash
        run: |
          set -euo pipefail
          cmake --build /tmp/keyless-block-core/build --target bitcoind -j 2 2>&1 | tee keyless-regtest-build.log
          ccache --show-stats
      - name: Mine valid proof, reject forgeries, exercise reorgs and rebuild chainstate
        shell: bash
        run: |
          set -euo pipefail
          python3 BIPSpace/Keyless-CHECKSIG/core/regtest_circle_blocks.py \
            --core /tmp/keyless-block-core \
            --bitcoind /tmp/keyless-block-core/build/bin/bitcoind \
            --vectors proof-evidence/circle-chain-vectors.json \
            --output keyless-regtest-evidence 2>&1 | tee keyless-regtest-run.log
      - name: Pin evidence hashes
        if: always()
        shell: bash
        run: |
          mkdir -p keyless-regtest-evidence
          python3 - <<'PY'
          import hashlib,json,pathlib
          roots=[pathlib.Path('keyless-regtest-core.patch'),pathlib.Path('keyless-regtest-build.log'),pathlib.Path('keyless-regtest-run.log')]
          roots+=list(pathlib.Path('keyless-regtest-evidence').glob('*.blockhex'))
          roots+=list(pathlib.Path('keyless-regtest-evidence').glob('*.hex'))
          roots+=list(pathlib.Path('keyless-regtest-evidence').glob('results.json'))
          hashes={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in roots if p.exists()}
          pathlib.Path('keyless-regtest-evidence/hashes.json').write_text(json.dumps(hashes,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keyless-circle-regtest-blocks
          path: |
            keyless-regtest-evidence/results.json
            keyless-regtest-evidence/hashes.json
            keyless-regtest-evidence/*.blockhex
            keyless-regtest-evidence/*.hex
            keyless-regtest-evidence/node/console.log
            keyless-regtest-evidence/node/regtest/debug.log
            keyless-regtest-core.patch
            keyless-regtest-build.log
            keyless-regtest-run.log
