name: TypeScript settlement-model tests

on:
  push:
    paths:
      - "model/**"
      - ".github/workflows/model-witnesses.yml"
  pull_request:
    paths:
      - "model/**"
      - ".github/workflows/model-witnesses.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check all finite reference-model witnesses
        run: node --experimental-strip-types --test "model/*.test.ts"
