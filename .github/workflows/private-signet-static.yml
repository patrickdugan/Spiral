name: Private Signet static checks

on:
  pull_request:
    paths:
      - "Private Signet/**"
      - ".github/workflows/private-signet-static.yml"
  push:
    paths:
      - "Private Signet/**"
      - ".github/workflows/private-signet-static.yml"
  workflow_dispatch:

jobs:
  static:
    name: Python harness static validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile lab
        run: python -m py_compile "Private Signet/lab.py"
      - name: Run tests
        run: python -m unittest discover -s "Private Signet" -p 'test_lab.py' -v
