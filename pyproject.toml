[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "connector-calculus"
version = "0.1.0"
description = "Typed connector-subgraph algebra and bounded swarm experiments for Lightning routing"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.7",
  "networkx>=3.0",
  "numpy>=1.24",
  "reportlab>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
